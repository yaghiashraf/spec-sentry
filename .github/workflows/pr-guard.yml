name: "PR Guard (SpecSentry)"

on:
  pull_request:
    paths:
      - 'specs/**'

jobs:
  check-api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install oasdiff
        run: |
          curl -sSfL https://raw.githubusercontent.com/Tufin/oasdiff/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Compare baseline vs current (Demo behavior)
        id: oasdiff
        run: |
          # In a real environment, you would diff PR against main:
          # oasdiff breaking origin/main/specs/api.yaml specs/api.yaml
          
          echo "Comparing baseline.yaml and current.yaml..."
          
          # Check for breaking changes
          BREAKING_JSON=$(oasdiff breaking specs/baseline.yaml specs/current.yaml -f json || true)
          echo "$BREAKING_JSON" > reports/latest_breaking.json
          
          # Generate Changelog
          CHANGELOG_MD=$(oasdiff changelog specs/baseline.yaml specs/current.yaml -f markdown || true)
          echo "$CHANGELOG_MD" > reports/latest_changelog.md
          
          # Check if breaking changes exist
          BREAKING_COUNT=$(echo "$BREAKING_JSON" | grep -c "ERR" || echo 0)
          if [ "$BREAKING_COUNT" -gt "0" ]; then
            echo "has_breaking=true" >> $GITHUB_OUTPUT
            echo "::error::Breaking changes detected in OpenAPI spec!"
          else
            echo "has_breaking=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let changelog = fs.readFileSync('reports/latest_changelog.md', 'utf8');
            // Add Demo watermark if needed based on ENV or just always add it in template
            changelog += "\\n\\n_Generated by SpecSentry (DEMO - NOT FOR PRODUCTION)_";
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### 🔍 SpecSentry API Report\\n\\n" + changelog
            });

      - name: Fail if Breaking
        if: steps.oasdiff.outputs.has_breaking == 'true'
        run: exit 1
