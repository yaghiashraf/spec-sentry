openapi: 3.0.0
info:
  title: Demo API
  version: 1.1.0
paths:
  /users:
    get:
      summary: List users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string # BREAKING CHANGE: Changed type from integer to string
                    name:
                      type: string
    post:
      summary: Create a user # MINOR: Added new endpoint
      responses:
        '201':
          description: User created
